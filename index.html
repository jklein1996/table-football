<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1512">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Turkey Bowl">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Turkey Bowl LVII</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=Barlow:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: night-game stadium app. Header, scoreboard band, green field, your-turn card, bottom tab bar. Single dark look by choice. */
:root{
  --night:#0b1512; --turf:#2f7d3e; --turf2:#2a7038; --chalk:#f2f6ee; --dim:#a3b6ab; --line:#2a3c35;
  --panel:#12201b; --panel2:#182a23;
  --kc:#e31837; --kcgold:#ffb81c; --phi:#00a3ad; --phidk:#004c54; --phisilver:#c4ced3;
  --good:#5bd17a; --bad:#ff6b5b;
  --display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--night);color:var(--chalk);margin:0}
body{font-family:var(--body);font-size:15px;line-height:1.4;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 86px)}
body.tvmode{padding-bottom:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--kcgold);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.02em;margin:0;text-wrap:balance}
h2{font-size:22px}
.muted{color:var(--dim)} .small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:700}
.btn:hover{border-color:var(--dim)}
.btn.primary{background:var(--kcgold);color:#1a1300;border-color:var(--kcgold)}
.btn.danger{background:#5a1414;border-color:var(--bad)}
.btn.ghost{background:transparent}
.btn.big{font-size:18px;padding:14px 20px;width:100%}
.row .btn.big{width:auto;flex:1}
.btn.small{padding:7px 10px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.team-kc{border-color:var(--kc)} .btn.team-kc.on{background:var(--kc)}
.btn.team-phi{border-color:var(--phi)} .btn.team-phi.on{background:var(--phidk)}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.inp{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:17px;color:var(--chalk)}
.code-inp{font-family:var(--mono);font-size:30px;letter-spacing:.3em;text-transform:uppercase;text-align:center}
.note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.note.err{border-color:var(--bad)}
.hero{padding:18px 2px 4px;display:flex;flex-direction:column;gap:6px}
.hero h1{font-size:clamp(42px,11vw,76px);line-height:.92}
.hero h1 .kc{color:var(--kc)} .hero h1 .phi{color:var(--phi)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:20px;letter-spacing:.04em}.brand b{color:var(--kcgold)}
.chip{font-family:var(--mono);font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap}
.chip b{color:var(--kcgold)} .chip.ok{border-color:var(--good);color:var(--good)} .chip.live{border-color:var(--good)}
.chip.kc{border-color:var(--kc)} .chip.phi{border-color:var(--phi)}
.sync{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line)}
.sync.on{color:var(--good);border-color:var(--good)} .sync.off{color:var(--bad);border-color:var(--bad)}
/* Scoreboard */
.board{display:grid;grid-template-columns:1fr auto 1fr;background:#060c0a;border:2px solid #24352e;border-radius:14px;overflow:hidden}
.team{display:flex;align-items:center;gap:8px;padding:8px 10px;min-width:0}
.team.kc{background:linear-gradient(90deg,#6a0c1a,#2a0a10)} .team.phi{background:linear-gradient(270deg,#004c54,#06201f);justify-content:flex-end;text-align:right}
.team .nm{font-family:var(--display);font-size:clamp(17px,4.4vw,28px);line-height:1}
.team .sc{font-family:var(--mono);font-weight:700;font-size:clamp(30px,9vw,54px);line-height:1;font-variant-numeric:tabular-nums}
.team .ball{width:12px;height:8px;border-radius:50%;background:#a0522d;border:1px solid #f3d6b4;display:inline-block;vertical-align:middle}
.tos{display:inline-flex;gap:3px;margin-top:4px}.tos i{width:14px;height:4px;border-radius:2px;background:#ffffff30}.tos i.on{background:var(--kcgold)}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 10px;gap:0;min-width:92px;background:#000}
.clk{font-family:var(--mono);font-weight:700;font-size:clamp(24px,6.5vw,40px);color:#ffd84d;font-variant-numeric:tabular-nums;line-height:1.05}
.clk.run{color:#fff}
.mid .q{font-family:var(--display);font-size:16px;color:var(--dim)}
.board.big .team .sc{font-size:clamp(48px,8vw,110px)} .board.big .clk{font-size:clamp(40px,6vw,90px)} .board.big .team .nm{font-size:clamp(24px,4vw,54px)} .board.big .mid .q{font-size:28px}
.dd{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
/* Field */
.fieldbox{overflow-x:auto;border-radius:12px;-webkit-overflow-scrolling:touch}
.field{position:relative;height:clamp(120px,34vw,180px);min-width:0;border-radius:12px;overflow:hidden;background:repeating-linear-gradient(90deg,var(--turf) 0 4.1667%,var(--turf2) 4.1667% 8.333%);box-shadow:inset 0 0 0 3px #f2f6eecc}
.field.big{height:min(46vh,420px);min-width:0}
.ez{position:absolute;top:0;bottom:0;width:8.333%;display:flex;align-items:center;justify-content:center}
.ez span{font-family:var(--display);font-size:clamp(14px,2.4vw,34px);letter-spacing:.25em;writing-mode:vertical-rl}
.ez.l{left:0;background:var(--kc)} .ez.l span{transform:rotate(180deg);color:var(--kcgold)}
.ez.r{right:0;background:var(--phidk)} .ez.r span{color:var(--phisilver)}
.yl{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#f2f6eeb0}
.yl.minor{width:1px;background:#f2f6ee55}
.yl.goal{width:4px;margin-left:-2px;background:#fff}
.yn{position:absolute;bottom:6px;transform:translateX(-50%);font-family:var(--display);font-size:clamp(13px,2vw,30px);color:#f2f6eee0}
.yn.top{top:6px;bottom:auto;transform:translateX(-50%) rotate(180deg)}
.hash{position:absolute;left:8.333%;right:8.333%;height:0;border-top:2px dashed #f2f6ee55}.hash.h1{top:38%}.hash.h2{top:62%}
.logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(20px,4vw,60px);color:#ffffff22;letter-spacing:.1em}
.los{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:#4da3ff;transition:left .7s ease}
.fdl{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--kcgold);transition:left .7s ease}
.fb{position:absolute;top:50%;width:30px;height:18px;margin:-9px 0 0 -15px;border-radius:50%;background:#7a3b12;border:2px solid #f3d6b4;box-shadow:0 3px 8px #000a;transition:left .7s ease}
.field.big .fb{width:48px;height:28px;margin:-14px 0 0 -24px}
.fb::after{content:"";position:absolute;left:28%;right:28%;top:45%;height:2px;background:#fff}
.dirarrow{position:absolute;top:18%;transform:translateX(-50%);font-family:var(--mono);font-weight:700;font-size:12px;background:#000b;padding:2px 6px;border-radius:6px;transition:left .7s ease;white-space:nowrap}
.field.big .dirarrow{font-size:20px}
/* Result */
.result{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.result .big{font-family:var(--display);font-size:clamp(20px,5vw,30px);line-height:1.05;flex:1;min-width:0}
.result.td{border-color:var(--kcgold);box-shadow:0 0 0 2px #ffb81c55 inset} .result.to{border-color:var(--bad)}
.dice{display:flex;gap:5px;align-items:center}
.die{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:17px;border:2px solid #0006}
.die.t{background:#111;color:#fff;border-color:#666} .die.o{background:#f6f4ee;color:#111} .die.d{background:#b3202c;color:#fff}
.die.roll{animation:wob .5s ease}
@keyframes wob{0%{transform:rotate(0) scale(1)}30%{transform:rotate(25deg) scale(1.15)}60%{transform:rotate(-15deg)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.die.roll{animation:none}.fb,.los,.fdl,.dirarrow{transition:none}}
/* Panels */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel.slim{padding:10px 12px}
.panel.kc{border-top:5px solid var(--kc)} .panel.phi{border-top:5px solid var(--phi)}
.panel.turn{box-shadow:0 0 0 2px #ffb81c66}
details.panel summary{cursor:pointer;font-weight:700}
.plays{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.play{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:70px}
.play b{font-family:var(--display);font-size:18px;letter-spacing:.02em;line-height:1.05}
.play .s{font-size:12px;color:var(--dim)} .play .stars{font-family:var(--mono);font-size:11px;color:var(--kcgold)}
.play.sel{outline:3px solid var(--kcgold);background:#2e2810}
.play.def.sel{outline-color:var(--phi);background:#0b2a2c}
.play[disabled]{opacity:.4}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.seg button small{font-family:var(--mono);font-size:11px;color:var(--dim);font-weight:500}
.seg button.on{background:#2e2810;border-color:var(--kcgold)}
.seg.wide button{font-family:var(--display);font-size:18px}
.wait{background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:12px}
.manual{display:flex;flex-direction:column;gap:8px}
.manual label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--dim)}
.faces{display:flex;gap:5px}
.faces button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-family:var(--mono);font-weight:700;font-size:16px}
.faces button.on{background:var(--kcgold);color:#111}
.roster{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.roster li{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.roster li>span:first-child{font-weight:700}
.roles{display:flex;gap:4px}
.pill{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:999px;background:#2e2810;color:var(--kcgold);border:1px solid var(--kcgold)}
.pill.r{background:#3a1212;color:#ffb0a8;border-color:#ff8a7a}
.adm{margin-left:auto;display:flex;gap:4px}
.mini{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel2)}
.share{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.qr{width:150px;height:150px;background:#fff;border-radius:10px;padding:6px;flex:none}
.qr svg{width:100%;height:100%;display:block}
.code{font-family:var(--mono);font-size:40px;font-weight:700;letter-spacing:.2em;color:var(--kcgold)}
.url{font-family:var(--mono);word-break:break-all;color:var(--dim);user-select:all}
.log{display:flex;flex-direction:column;gap:4px;max-height:300px;overflow:auto;font-size:13px}
.log div{padding:5px 8px;border-radius:6px;background:var(--panel2)}
.log .k{border-left:4px solid var(--kc)} .log .p{border-left:4px solid var(--phi)}
table{border-collapse:collapse;font-size:12.5px;width:100%}
th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
td.good{color:var(--good)} td.bad{color:var(--bad)}
.tbl{overflow-x:auto}
.cell-td{color:var(--kcgold);font-weight:700}.cell-to{color:var(--bad);font-weight:700}.cell-inc{color:var(--dim)}
ol.small,ul.small{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;background:#08110ef2;border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));backdrop-filter:blur(8px)}
.tabbar button{flex:1;max-width:120px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--dim);padding:4px 0;border-radius:8px}
.tabbar button span{font-size:20px}
.tabbar button.on{color:var(--kcgold);background:#ffffff0d}
.cover{position:fixed;inset:0;background:#040a08e8;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px}
.tv{display:flex;flex-direction:column;gap:14px;max-width:1600px;margin:0 auto}
.tvwait{font-size:clamp(16px,2.2vw,28px);color:var(--dim);text-align:center}
.tv .result .big{font-size:clamp(24px,3.4vw,52px)}
.tv .die{width:clamp(36px,4vw,64px);height:clamp(36px,4vw,64px);font-size:clamp(17px,2vw,30px)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
/* Paydirt-style charts */
.pd{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px;background:#0a0d0b;-webkit-overflow-scrolling:touch}
.pd table{border-collapse:separate;border-spacing:3px;font-family:var(--mono);font-size:12px;min-width:max-content}
.pd thead th{position:sticky;top:0;z-index:2;background:#151a17;color:var(--dim);font:600 11px var(--body);padding:6px 4px;white-space:nowrap;max-width:76px;white-space:normal;line-height:1.15}
.pd th.rk{position:sticky;left:0;z-index:1;background:#151a17;color:var(--kcgold);font:700 14px var(--mono);padding:0 8px;text-align:right;white-space:nowrap}
.pd thead th.rk{z-index:3}
.pd tr.dec th.rk{border-top:2px solid var(--kcgold)}
.bx{width:58px;height:34px;text-align:center;vertical-align:middle;border-radius:4px;position:relative;padding:2px;line-height:1.05}
.bx b{display:block;font-size:14px}.bx i{display:block;font-style:normal;font-size:9px;opacity:.85;letter-spacing:.02em}
.bx u{position:absolute;top:1px;right:2px;font-size:8px;text-decoration:none;color:var(--kcgold)}
.bx.blk{background:#000;color:#fff;border:1px solid #3a3a3a}
.bx.red{background:#b3001b;color:#fff;border:1px solid #ff4a5f}
.bx.brk{background:#000;color:var(--kcgold);border:2px solid var(--kcgold)}
.bx.plus{background:#000;color:#6fe39a;border:1px solid #2c6b44}
.bx.inc{background:transparent;color:#7d867f;border:1px dashed #3a403c}
.pd tr.hr th.rk,.pd th.hc{background:#3a2f0c;color:#fff}
.bx.hi{outline:3px solid var(--kcgold);outline-offset:1px;transform:scale(1.08);z-index:1;box-shadow:0 0 14px #ffb81caa}
.mini{display:inline-block;min-width:34px;padding:2px 5px;margin-right:6px;border-radius:3px;text-align:center;font:700 12px var(--mono)}
.mini.blk{background:#000;color:#fff;border:1px solid #444}.mini.red{background:#b3001b;color:#fff}.mini.brk{background:#000;color:var(--kcgold);border:1px solid var(--kcgold)}.mini.plus{background:#000;color:#6fe39a;border:1px solid #2c6b44}.mini.inc{color:#7d867f;border:1px dashed #555}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}.legend u{text-decoration:none;color:var(--kcgold);font:700 10px var(--mono)}
.lookup{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:center;margin-top:8px;font-size:13px}
.lookup .lk{display:inline-flex;align-items:center}
.btn.sm{padding:6px 10px;font-size:13px;min-height:0}
body.tvmode .lookup .btn{display:none}
.pd.dc tbody th.rk{font:600 12px var(--body);text-transform:none;letter-spacing:0;color:var(--chalk);text-align:left;white-space:normal;min-width:72px;max-width:84px;line-height:1.1;padding:0 6px}
.pd.dc thead th{font:700 13px var(--mono);color:var(--kcgold);text-align:center}
.pd thead th{text-transform:none;letter-spacing:0}
.pd table{width:auto;margin:0}
/* Paydirt dice */
.die.blk{background:#0b0b0b;color:#fff;border-color:#555}.die.wht{background:#f4f1ea;color:#111}.die.blu{background:#1d5fd1;color:#fff;border-color:#7aa7ff}
.die.red{background:#c8102e;color:#fff;border-color:#ff6b7f}.die.grn{background:#1f8a3b;color:#fff;border-color:#69d48a}
.die.sm{display:inline-block;width:14px;height:14px;min-width:0;border-radius:3px;vertical-align:-2px;font-size:0;padding:0;border:1px solid #888}
.faces small{display:block;font-size:9px;opacity:.8}
.dicewrap{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.lookup .why{width:100%;justify-content:center;color:var(--dim);font-size:12px}
.result.waitroll{border-color:var(--kcgold);box-shadow:0 0 0 2px #ffb81c55 inset}
.bx.yel{background:#f2c200;color:#111;border:1px solid #ffe27a}.mini.yel{background:#f2c200;color:#111}
.pd td.pr{font-size:10px;color:var(--dim);text-align:center;min-width:26px}
.pd th.xc{color:var(--kcgold)}
.pd tr.odds td{font:10px/1.25 var(--body);color:var(--dim);text-align:center;vertical-align:top;padding:4px 2px;white-space:nowrap}
.pd.dc thead th small{display:block;font:9px var(--body);color:var(--dim)}
.dk td,.dk th{text-align:center;padding:4px 6px}
/* Field animations */
.fx{position:fixed;pointer-events:none;z-index:60;overflow:hidden;border-radius:12px}
.fx.shake{animation:fxshake .45s .15s 2}
@keyframes fxshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fxball{position:absolute;top:50%;width:24px;height:15px;margin:-8px 0 0 -12px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#b5652a,#5d2a0c);border:1px solid #2b1205;box-shadow:0 3px 6px #0008;left:var(--x0);animation:fxslide 1s cubic-bezier(.2,.7,.3,1) forwards}
.fxball.arc{animation:fxslide 1.1s linear forwards,fxarc 1.1s ease-in-out}
@keyframes fxslide{from{left:var(--x0)}to{left:var(--x1)}}
@keyframes fxarc{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-38px) scale(1.5)}100%{transform:translateY(0) scale(1)}}
.fxtxt{position:absolute;left:50%;top:50%;font:900 clamp(26px,8vw,72px)/1 var(--display);letter-spacing:.04em;white-space:nowrap;color:#fff;text-shadow:0 3px 0 #000,0 0 20px #000;opacity:0;animation:fxpop 2.3s .55s ease-out forwards}
.fxtxt.td{color:var(--kcgold)}.fxtxt.to{color:#ff4d5e}.fxtxt.flag{color:#ffd43b}.fxtxt.first{color:#fff}.fxtxt.dim{color:#d7e3dc;font-size:clamp(20px,6vw,48px)}
@keyframes fxpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}22%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.05)}}
.fxflag{position:absolute;left:50%;top:22%;font-size:34px;animation:fxflag 1.3s ease-out forwards}
@keyframes fxflag{0%{opacity:0;transform:translate(-140px,-70px) rotate(-260deg)}25%{opacity:1}100%{opacity:1;transform:translate(0,30px) rotate(0)}}
.fxline{position:absolute;top:0;bottom:0;width:6px;margin-left:-3px;background:var(--kcgold);box-shadow:0 0 18px var(--kcgold);opacity:0;animation:fxpulse .55s .9s 3}
@keyframes fxpulse{0%,100%{opacity:0}50%{opacity:1}}
.fxpost{position:absolute;top:12%;height:52%;width:30px;margin-left:-15px;border:4px solid #ffd43b;border-bottom:none;border-radius:2px;opacity:0;animation:fxpulse .6s .9s 3}
.fxpost::after{content:"";position:absolute;left:50%;bottom:-40%;height:40%;width:4px;margin-left:-2px;background:#ffd43b}
.fxpost.miss{border-color:#ff4d5e}.fxpost.miss::after{background:#ff4d5e}
.fxez{position:absolute;top:0;bottom:0;width:8.4%;background:#ffb81c;opacity:0;animation:fxpulse .5s .9s 4}.fxez.r{right:0}.fxez.l{left:0}
@media (prefers-reduced-motion:reduce){.fxtxt{animation-duration:1.8s;animation-delay:0s}}
/* Consistent buttons and spacing */
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{gap:14px}
.panel{padding:16px;gap:12px}
.stack{display:grid;gap:10px}
.stack .btn{width:100%;min-height:52px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:16px}
a.btn{color:inherit;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.row.btns{align-items:stretch}.row.btns .btn{flex:1;min-height:48px}
.hero{padding:8px 0 0;gap:10px}
.herobox{display:grid;gap:6px;background:#060c0a;border:2px solid #24352e;border-radius:14px;padding:12px 16px}
.hl{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.hl b{font-family:var(--mono);font-size:30px;color:var(--chalk)}
.hl.kc span{color:var(--kc)}.hl.phi span{color:var(--phi)}
/* Result banner: dice on top, words below, lookup last */
.result{flex-direction:column;align-items:stretch;text-align:center;gap:10px;padding:12px 14px}
.result .big{flex:none;font-size:clamp(20px,5.4vw,28px)}
.tv .result .big{font-size:clamp(24px,2.6vw,40px)}
.dicewrap .tag{margin-left:6px}
.clockbox{background:#060c0a;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:4px;font-family:var(--body)}
.clockbox b{color:#ffd84d;font-family:var(--mono)}
.clockwarn{color:#ffd84d;font-weight:700;font-size:14px}.clockwarn.bad{color:#ff6b5b}
.play .s.clk{color:#cfe3d6;font-size:11px}

/* Real Paydirt sheet colors: green = gain, white = no gain, black = incomplete, red = bad for the offense, yellow = flag */
.bx.blk{background:#9ccc3c;color:#0d1a05;border:1px solid #6f9a1f}
.bx.wht{background:#f4f4f0;color:#111;border:1px solid #cfcfc8}
.bx.inc{background:#000;color:#5c605d;border:1px solid #000}
.bx.brk{background:#9ccc3c;color:#0d1a05;border:2px solid #0d1a05;font-weight:800}
.mini.blk{background:#9ccc3c;color:#0d1a05;border:1px solid #6f9a1f}.mini.wht{background:#f4f4f0;color:#111}
.mini.inc{background:#000;color:#8a8f8b;border:1px solid #333}.mini.brk{background:#9ccc3c;color:#0d1a05;border:1px solid #0d1a05}

/* Join QR: room around it, tap to enlarge */
.share{gap:18px;margin:16px 0 4px}
.share .qr{cursor:zoom-in;box-shadow:0 0 0 4px #ffffff14}
.share .qr:focus-visible{outline:3px solid var(--kcgold);outline-offset:3px}
.share .code{margin:2px 0 6px}.share .url{margin-bottom:10px}
.qrhint{font-size:12px;color:var(--dim);margin-top:6px;text-align:center;width:150px}
.qrbig{position:fixed;inset:0;z-index:200;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;cursor:zoom-out}
.qrbig .big{width:min(88vw,70vh);height:min(88vw,70vh)}.qrbig .big svg{width:100%;height:100%;display:block}
.qrbig .c{font:700 44px/1 var(--mono);letter-spacing:.25em;color:#111}.qrbig .h{font:600 16px var(--body);color:#555}

</style>
</head>

<div class="wrap" id="app"></div>
<canvas class="confetti" id="confetti" hidden></canvas>
<script src="js/peerjs.min.js"></script>
<script src="js/qrcode.js"></script>
<script src="js/relay-url.js"></script>
<script src="js/relay.js"></script>
<script src="js/game.js"></script>
</body>
</html>
